name: E2E tests

on:
  push:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-popup:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        os: [ubuntu-latest, windows-latest, macos-latest]

        exclude:
          - os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'dummy' || 'windows-latest' }}
          - os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'dummy' || 'macos-latest' }}

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          build: npm run build
          start: npm run popup:serve
          start-windows: npm run popup:serve
          browser: ${{ matrix.browser }}
          spec: cypress/e2e/testPopup.cy.js
          wait-on: 'http://localhost:8000'
          wait-on-timeout: 30
          headed: true
