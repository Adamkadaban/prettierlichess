name: Create build for release

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Setup Node.js and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm install

      - name: Build the release version
        run: |
          npm run build
          cd dist
          zip -r build.zip .
          cd ..

      - name: Upload build version as artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: build-version
          path: ./dist/build.zip

  bundle-source:
    name: Bundle source code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Bundle the source files
        run: zip -r sourcecode.zip -@ < sourcelist.txt

      - name: Upload source code as artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: sourcecode
          path: ./sourcecode.zip

  upload:
    name: Upload build to github release
    needs: [ build, bundle-source ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build version
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: build-version
          path: .

      - name: Download source code
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: sourcecode
          path: .

      - name: Upload build to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./build.zip
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload sourcecode to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./sourcecode.zip
          tag: ${{ github.ref }}
          overwrite: true

  publish-firefox:
    name: Publish for Firefox
    needs: [ build ]
    runs-on: ubuntu-latest
    if: false
    environment:
      name: publish
      url: https://addons.mozilla.org/en-US/firefox/addon/prettier-lichess/

    steps:
      - name: Download build version
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: build-version
          path: .

  publish-chrome:
    name: Publish for Chrome
    needs: [ build ]
    runs-on: ubuntu-latest
    if: false
    environment:
      name: publish
      url: https://chrome.google.com/webstore/detail/prettier-lichess/epgnobcgnmchnhgkgpedebbmhbblfcob

    steps:
      - name: Download build version
        uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: build-version
          path: .
